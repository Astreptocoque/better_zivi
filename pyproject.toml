[project]
name = "zivi"
version = "0.1.0"
description = "Search engine and map UI for ZiviConnect civil-service assignments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.scripts]
zivi = "zivi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zivi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
